[project]
name = "futurespace"
version = "0.1.0"
description = "Coleta, padroniza e serve dados abertos de clima espacial de várias fontes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# A API usa só httpx + fastapi; ficam no núcleo para que qualquer instalador
# (requirements.txt ou pyproject, como na Vercel) consiga subi-la.
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
]

[project.optional-dependencies]
pipeline = [
    "pandas>=2.2",
    "pyarrow>=16",
]
hf = [
    "huggingface_hub>=0.25",
]
s3 = [
    "boto3>=1.34",
]
api = [
    "uvicorn>=0.30",
]
ml = [
    "futurespace[pipeline]",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]
dev = [
    "futurespace[pipeline,api,ml]",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
futurespace = "futurespace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/futurespace"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
