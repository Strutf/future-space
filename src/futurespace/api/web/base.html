<!doctype html>
<html lang="{{t:lang}}" data-lang="{{lang}}" data-urls="{{page_urls}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{t:meta.description}}">
{{hreflang_links}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Permanent+Marker&display=swap">
<link rel="stylesheet" href="{{static:chalk.css}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2318202b'/%3E%3Cpath d='M12 3 L14.4 9.4 L21 9.6 L15.8 13.6 L17.8 20.2 L12 16.3 L6.2 20.3 L8.2 13.7 L3 9.7 L9.6 9.3 Z' fill='none' stroke='%23ffd76a' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E">
<!-- Textos usados pelos scripts das páginas, vindos do arquivo de tradução do idioma. -->
<script>window.T = {{js_i18n}};</script>
<!-- Carregado antes do conteúdo: os scripts de cada página usam t(), fmt() e getJson() daqui. -->
<script src="{{static:chalk.js}}"></script>
</head>
<body data-page="{{page}}">
<!-- Filtros de giz: "chalk" dá textura granulada ao traço, "wobble" faz as linhas tremerem como desenho à mão. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="chalk" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="grain"/>
    <feDisplacementMap in="SourceGraphic" in2="grain" scale="3" xChannelSelector="R" yChannelSelector="G" result="rough"/>
    <feComponentTransfer in="grain" result="holes"><feFuncA type="discrete" tableValues="1 1 1 0.55"/></feComponentTransfer>
    <feComposite in="rough" in2="holes" operator="in"/>
  </filter>
  <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div class="sky" aria-hidden="true"></div>
<div class="page">
  <nav class="nav" aria-label="{{t:nav.aria}}">
    <a href="{{url:home}}" data-page="home">{{t:nav.home}}</a>
    <a href="{{url:dashboard}}" data-page="dashboard">{{t:nav.dashboard}}</a>
    <a href="{{url:sobre}}" data-page="sobre">{{t:nav.sobre}}</a>
    <a href="{{url:interativo}}" data-page="interativo">{{t:nav.interativo}}</a>
    <details class="lang-menu">
      <summary aria-label="{{t:nav.lang_label}}">
        <svg class="globe" viewBox="0 0 32 32" aria-hidden="true"><g filter="url(#wobble)">
          <circle cx="16" cy="16" r="11"/><path d="M5 16h22M16 5q-8 11 0 22M16 5q8 11 0 22M7.5 10h17M7.5 22h17"/>
        </g></svg>
        <span>{{t:nav.lang_name}}</span>
        <svg class="caret" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1.5 Q6 7 11 1.5"/></svg>
      </summary>
      <div class="lang-list" role="list">
        {{language_menu}}
      </div>
    </details>
  </nav>
  {{content}}
  <footer class="footer">
    {{t:footer.disclaimer}}<br>
    <a href="/docs">{{t:footer.api}}</a> ·
    <a href="https://huggingface.co/datasets/Strutf/future-space" rel="noopener">{{t:footer.data}}</a> ·
    <a href="https://github.com/Strutf/future-space" rel="noopener">{{t:footer.code}}</a>
  </footer>
</div>
</body>
</html>
