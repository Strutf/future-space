<style>
  .soon { text-align: center; padding: 72px 0 24px; }
  .soon h1 { font-size: clamp(44px, 9vw, 84px); transform: rotate(-2deg); }
  .soon p { font-size: 22px; color: var(--chalk-soft); max-width: 560px; margin: 18px auto 0; }
  .rocket { width: 180px; height: 180px; margin: 32px auto 0; display: block; }
  .rocket * { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .flame { animation: flicker 0.6s ease-in-out infinite alternate; transform-origin: 90px 150px; }
  @keyframes flicker { from { transform: scaleY(0.8); } to { transform: scaleY(1.15); } }
  @media (prefers-reduced-motion: reduce) { .flame { animation: none; } }
</style>

<section class="soon">
  <h1 class="chalk-text">{{t:interativo.title}}</h1>
  <svg class="rocket wiggle" viewBox="0 0 180 180" aria-hidden="true">
    <g filter="url(#wobble)">
      <path d="M90 20 Q118 52 112 112 H68 Q62 52 90 20 Z" stroke="var(--chalk)"/>
      <circle cx="90" cy="70" r="11" stroke="var(--chalk-blue)"/>
      <path d="M68 96 L50 124 L68 116 M112 96 L130 124 L112 116" stroke="var(--chalk-pink)"/>
      <path class="flame" d="M76 116 Q90 168 104 116" stroke="var(--chalk-orange)"/>
    </g>
  </svg>
  <p>{{t:interativo.text}}</p>
</section>
