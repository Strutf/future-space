version: 2
updates:
  # Atualiza os SHAs fixados das actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Atualiza requirements-pipeline.txt e requirements.txt.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
