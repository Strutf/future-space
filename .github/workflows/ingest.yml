name: ingest

on:
  schedule:
    # De hora em hora, no minuto 23: o início da hora é o horário mais congestionado do
    # GitHub. Os endpoints de vento solar só guardam ~24h, então atrasos não perdem dados.
    - cron: "*/5 * * * *"  # TEMPORÁRIO: teste do agendamento; voltar para "23 * * * *"
    # Uma vez por dia: fontes históricas com atraso (OMNI, Kp oficial do GFZ).
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      schedule:
        description: "realtime, daily ou all"
        type: choice
        options: [realtime, daily, all]
        default: realtime

# O GITHUB_TOKEN deste workflow só pode ler o repositório.
permissions:
  contents: read

# Mesmo grupo do workflow de treino: só um job grava no Hugging Face por vez.
concurrency:
  group: hf-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FS_STORAGE: hf
      FS_HF_REPO: ${{ vars.FS_HF_REPO }}
    steps:
      - name: Verificar configuração
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ok=true
          if [ -z "$FS_HF_REPO" ]; then
            echo "::error::Variável FS_HF_REPO ausente. Crie em Settings > Secrets and variables > Actions > aba Variables (não em Secrets)."
            ok=false
          fi
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Secret HF_TOKEN ausente. Crie em Settings > Secrets and variables > Actions > aba Secrets."
            ok=false
          fi
          $ok
      # Actions fixadas por SHA: uma tag pode ser movida para outro código, um SHA não.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      # Instalação sem o token no ambiente: código de terceiros não consegue lê-lo.
      - run: pip install -c requirements-pipeline.txt ".[pipeline,hf,ml]"
      - name: Escolher agenda
        id: agenda
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_SCHEDULE: ${{ inputs.schedule }}
        run: |
          if [ -n "$INPUT_SCHEDULE" ]; then
            echo "schedule=$INPUT_SCHEDULE" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_SCHEDULE" = "47 3 * * *" ]; then
            echo "schedule=daily" >> "$GITHUB_OUTPUT"
          else
            echo "schedule=realtime" >> "$GITHUB_OUTPUT"
          fi
      - name: Coletar
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SCHEDULE: ${{ steps.agenda.outputs.schedule }}
        run: futurespace update --schedule "$SCHEDULE"
      # Roda mesmo se alguma fonte falhou: os modelos lidam com dados faltantes.
      - name: Prever
        if: ${{ !cancelled() && steps.agenda.outputs.schedule != 'daily' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: futurespace predict
      # Uma vez por dia: compara as previsões passadas com o que aconteceu.
      - name: Verificar previsões
        if: ${{ !cancelled() && steps.agenda.outputs.schedule != 'realtime' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: futurespace verify
