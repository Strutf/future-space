name: ingest

on:
  schedule:
    # De hora em hora (minuto 7 para fugir do pico do GitHub). Os endpoints de vento
    # solar só guardam ~24h, então qualquer intervalo bem menor que isso é seguro.
    - cron: "7 * * * *"
    # Uma vez por dia: fontes históricas com atraso (OMNI, Kp oficial do GFZ).
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      schedule:
        description: "realtime, daily ou all"
        type: choice
        options: [realtime, daily, all]
        default: realtime

# O GITHUB_TOKEN deste workflow só pode ler o repositório.
permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FS_STORAGE: hf
      FS_HF_REPO: ${{ vars.FS_HF_REPO }}
    steps:
      - name: Verificar configuração
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ok=true
          if [ -z "$FS_HF_REPO" ]; then
            echo "::error::Variável FS_HF_REPO ausente. Crie em Settings > Secrets and variables > Actions > aba Variables (não em Secrets)."
            ok=false
          fi
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Secret HF_TOKEN ausente. Crie em Settings > Secrets and variables > Actions > aba Secrets."
            ok=false
          fi
          $ok
      # Actions fixadas por SHA: uma tag pode ser movida para outro código, um SHA não.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      # Instalação sem o token no ambiente: código de terceiros não consegue lê-lo.
      - run: pip install -c requirements-pipeline.txt ".[pipeline,hf]"
      - name: Coletar
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_SCHEDULE: ${{ inputs.schedule }}
        run: |
          if [ -n "$INPUT_SCHEDULE" ]; then
            SCHEDULE="$INPUT_SCHEDULE"
          elif [ "$EVENT_SCHEDULE" = "17 3 * * *" ]; then
            SCHEDULE=daily
          else
            SCHEDULE=realtime
          fi
          futurespace update --schedule "$SCHEDULE"
