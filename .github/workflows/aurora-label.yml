name: aurora-label

# Pesquisa da probabilidade da aurora: classifica as imagens coletadas pelo aurora-sample,
# junta Kp, vento solar, coordenadas magnéticas, Sol, Lua e nuvens (ERA5), ajusta a
# probabilidade e guarda tudo em research/aurora/results/ no Hugging Face.
# Roda depois de cada aurora-sample, mas só refaz o trabalho quando há imagens novas.
on:
  workflow_run:
    workflows: [aurora-sample]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-label
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FS_HF_REPO: ${{ vars.FS_HF_REPO }}
    steps:
      - name: Há imagens novas?
        id: check
        run: |
          base="https://huggingface.co/api/datasets/$FS_HF_REPO/tree/main/research/aurora/themis"
          now=$(curl -sf "$base" | jq '[.[] | select(.type == "directory")] | length' || echo 0)
          before=$(curl -sfL "https://huggingface.co/datasets/$FS_HF_REPO/resolve/main/research/aurora/results/state.json" | jq '.folders' || echo -1)
          echo "pastas agora: $now, na última rodada: $before"
          if [ "$now" -gt 0 ] && [ "$now" != "$before" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; fi
          echo "folders=$now" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.check.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        if: steps.check.outputs.run == 'true'
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -c requirements-pipeline.txt ".[pipeline,hf,ml]" pillow
      - name: Montar a base e ajustar a probabilidade
        if: steps.check.outputs.run == 'true'
        run: |
          python research/aurora/build_dataset.py "$FS_HF_REPO" work results
          python research/aurora/fit_probability.py results
          echo "{\"folders\": ${{ steps.check.outputs.folders }}}" > results/state.json
      - name: Enviar ao Hugging Face
        if: steps.check.outputs.run == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              repo_id=os.environ["FS_HF_REPO"], repo_type="dataset", folder_path="results",
              path_in_repo="research/aurora/results", commit_message="aurora: base rotulada e calibração",
          )
          PY
